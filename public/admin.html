<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activation metrics · Sell Sphere</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">

</head>
<body>
<header class="topbar"><a class="logo" href="/" aria-label="Sell Sphere home"><img src="/brand/sell-sphere-icon.svg" alt="" width="36" height="30"><span class="logo-word">Sell <b>Sphere</b></span></a><span class="spacer"></span><span class="eyebrow">Internal</span></header>
<main class="page">
  <section class="hero"><h1 style="font-size:24px">Activation metrics</h1>
    <p>Real events only. No demo data. Definitions match the decision doc §6. Needs the <code>METRICS_TOKEN</code> set in Vercel.</p></section>
  <form class="card" id="f">
    <div class="field"><label for="tok">Admin token</label><input id="tok" type="password" autocomplete="off" required></div>
    <div class="field"><label for="days">Window</label><select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select></div>
    <button class="btn btn-primary btn-block" type="submit">Load metrics</button>
    <div class="note error" id="err" hidden></div>
  </form>
  <section class="card" id="out" hidden></section>
</main>
<script type="module" src="/assets/admin.js"></script>
</body>
</html>
